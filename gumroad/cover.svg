<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="60%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Grid Lattice -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Central Swarm Constellation -->
  <g filter="url(#glow)">
    <!-- Connections -->
    <path d="M 640 260 L 460 380 M 640 260 L 820 380 M 460 380 L 520 540 M 820 380 L 760 540 M 520 540 L 760 540 M 640 260 L 640 430 M 460 380 L 640 430 M 820 380 L 640 430 M 520 540 L 640 430 M 760 540 L 640 430" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    
    <!-- Nodes -->
    <circle cx="640" cy="260" r="16" fill="#38bdf8"/>
    <circle cx="460" cy="380" r="14" fill="#818cf8"/>
    <circle cx="820" cy="380" r="14" fill="#c084fc"/>
    <circle cx="520" cy="540" r="14" fill="#34d399"/>
    <circle cx="760" cy="540" r="14" fill="#fbbf24"/>
    <circle cx="640" cy="430" r="18" fill="#f43f5e"/>
  </g>

  <!-- Branding & Badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <!-- Top Super-header -->
    <text x="640" y="80" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="4" fill="#38bdf8">LOVELOGICAI • AUTONOMOUS AGENT INFRASTRUCTURE</text>
    
    <!-- Main Title -->
    <text x="640" y="150" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="1" fill="url(#primaryGrad)">HYDRA-MESH v2.0-QUANTUM</text>
    
    <!-- Subtitle -->
    <text x="640" y="195" text-anchor="middle" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Distributed Multi-Channel Hivemind • 482 FPS Disimage Terminal Cockpit</text>
    
    <!-- Node Labels -->
    <text x="640" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">DevTheDude (Apex)</text>
    <text x="390" y="385" text-anchor="end" font-size="13" font-weight="600" fill="#cbd5e1">Telegram Dispatch</text>
    <text x="890" y="385" text-anchor="start" font-size="13" font-weight="600" fill="#cbd5e1">Slack Ingress</text>
    <text x="450" y="565" text-anchor="end" font-size="13" font-weight="600" fill="#cbd5e1">Discord Bridge</text>
    <text x="830" y="565" text-anchor="start" font-size="13" font-weight="600" fill="#cbd5e1">Hermes Mailbox</text>
    <text x="640" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">MERKLE ROOT</text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(140, 625)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="220" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="110" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#38bdf8">⚡ 482.8 FPS Disimage</text>

      <!-- Pill 2 -->
      <rect x="250" y="0" width="230" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
      <text x="365" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#818cf8">⚖️ Dutch Capability Auction</text>

      <!-- Pill 3 -->
      <rect x="510" y="0" width="230" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="625" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#c084fc">🌳 Merkle Flight Recorder</text>

      <!-- Pill 4 -->
      <rect x="770" y="0" width="230" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="885" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">🍎 Apple Silicon M4 Native</text>
    </g>
  </g>
</svg>
